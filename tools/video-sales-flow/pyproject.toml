[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-sales-flow"
version = "0.1.0"
description = "Local apparel sales video workflow with Google Flow browser automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "playwright>=1.50,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
video-sales-flow = "video_sales_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
